; MRider vehicle firmware - the Teensy 4.1 DBW controller.
;
; Spec: docs/design/dbw.md 10 (interface, blocks, state machine) and 12
; (numbers). Bring-up order and gates: docs/build/04-firmware.md.
;
;   pio run -e vehicle2 -t upload          # flash vehicle 2
;
; ONE ENVIRONMENT PER VEHICLE, and they differ in one line. Vehicle N asks
; for ROS domain 10 + N (docs/design/software.md 3.4). A board flashed with
; the wrong environment comes up in another vehicle's domain, and its laptop
; sees an empty graph with no error - so the number on the vehicle and the
; environment name must match.
;
; THE FIRST BUILD TAKES 10-20 MINUTES, PER ENVIRONMENT. micro_ros_platformio
; builds the micro-ROS static library from source, with mitt_msgs inside it
; (extra_packages/mitt_msgs is a link to ros2_ws/src/mitt_msgs). Later builds
; reuse it. Change a .msg file and the library must be rebuilt:
;   pio run -e vehicle2 -t clean_microros && pio run -e vehicle2
;
; DO NOT BUILD FROM A SHELL THAT HAS ROS SOURCED. The library build runs its
; own colcon and a sourced workspace leaks into it. Open a fresh terminal.

[platformio]
default_envs = vehicle1, vehicle2, vehicle3

; ---------------------------------------------------------------- the Teensy
[teensy]
; PINNED, and the same pin as firmware/bench, so the bench sketches and the
; vehicle firmware are built by one toolchain.
platform      = teensy@6.0.0
board         = teensy41
framework     = arduino
monitor_speed = 115200

; micro-ROS. Humble, USB serial: the transport docs/design/dbw.md 9 accepted.
; PINNED TO A COMMIT, not a branch. micro_ros_platformio has no release after
; 2.0.0 (2023-06), and main at this commit is what was built and checked
; 2026-11-24. dbw.md 9 names micro_ros_arduino; that library ships
; precompiled and cannot carry mitt_msgs without a Docker rebuild, which is
; why this one is used - same upstream, same Humble sources.
board_microros_distro    = humble
board_microros_transport = serial
board_microros_user_meta = microros.meta
extra_scripts            = pre:scripts/c_compat.py

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
    adafruit/Adafruit BNO08x@1.2.7
    ; QuadEncoder ships with the pinned teensy platform.

build_flags =
    -Wall
    -Wextra

[env:vehicle1]
extends     = teensy
build_flags = ${teensy.build_flags} -D MITT_VEHICLE=1

[env:vehicle2]
extends     = teensy
build_flags = ${teensy.build_flags} -D MITT_VEHICLE=2

[env:vehicle3]
extends     = teensy
build_flags = ${teensy.build_flags} -D MITT_VEHICLE=3

; ---------------------------------------------------------- the hang variant
; docs/build/04-firmware.md 4.4: "Build a variant that, on a serial command,
; enters while (true) {} inside the control loop." The command is the service
;   ros2 service call /mitt_dbw/test_hang std_srvs/srv/Trigger
; and it exists ONLY in this build. Flash it for the Stage 1 hang test, then
; flash the vehicle environment back. The vehicle number comes from the shell:
;   MITT_VEHICLE=2 pio run -e hang_test -t upload
[env:hang_test]
extends     = teensy
build_flags = ${teensy.build_flags} -D MITT_VEHICLE=${sysenv.MITT_VEHICLE} -D MITT_HANG_TEST=1
