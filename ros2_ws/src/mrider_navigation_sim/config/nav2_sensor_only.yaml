# Simulation only. Geometry must match Limits and the ideal world.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.2
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 4.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      # Stay above vehicle 1's measured 2.10 m + 5% (2.205 m), without
      # forcing a 3 m turn to finish immediately beside an 8 m corridor wall.
      # Vehicle overlays can raise this floor; mission still audits curvature.
      minimum_turning_radius: 2.5
      # Preserve Dubins primitives. Humble's simple smoother can increase
      # interior curvature; the mission audits the final geometry as well.
      smooth_path: false
      cost_penalty: 3.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 8.0
controller_server:
  ros__parameters:
    controller_frequency: 30.0
    odom_topic: /mrider_sim/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 1.5
      min_lookahead_dist: 1.5
      max_lookahead_dist: 1.5
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: false
      allow_reversing: false
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 2.2
      regulated_linear_scaling_min_speed: 0.15
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 1.0
      use_interpolation: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      footprint: '[[-0.2, -0.3], [0.9, -0.3], [0.9, 0.3], [-0.2, 0.3]]'
      footprint_padding: 0.1
      # Must match slam_sensor_only.yaml before Smac caches metric primitives.
      resolution: 0.05
      transform_tolerance: 0.3
      rolling_window: true
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 15.0
          raytrace_min_range: 0.05
          obstacle_max_range: 14.9
          obstacle_min_range: 0.05
          observation_persistence: 0.0
          expected_update_rate: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
      width: 8
      height: 8
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[-0.2, -0.3], [0.9, -0.3], [0.9, 0.3], [-0.2, 0.3]]'
      footprint_padding: 0.1
      # StaticLayer later adopts /map resolution. A different initial value
      # silently rescales Smac's cached turning radius (0.10 -> 0.05 halves it).
      resolution: 0.05
      transform_tolerance: 0.3
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 15.0
          raytrace_min_range: 0.05
          obstacle_max_range: 14.9
          obstacle_min_range: 0.05
          observation_persistence: 0.0
          expected_update_rate: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
